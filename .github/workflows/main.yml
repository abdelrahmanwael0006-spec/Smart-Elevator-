name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.smart --project-name smart_elevator /tmp/app
          cp main.dart /tmp/app/lib/main.dart
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cd /tmp/app
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH"/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          P=$(find $HOME/.pub-cache -path "*flutter_bluetooth_serial-*/android/build.gradle" | head -1)
          python3 - "$P" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'buildscript\s*\{.*?\n\}\n', '', s, count=1, flags=re.S)
          s = s.replace('jcenter()', 'mavenCentral()')
          s = re.sub(r'compileSdkVersion \d+', 'compileSdkVersion 34', s)
          s = s.replace('android {', "android {\n    namespace 'io.github.edufolly.flutterbluetoothserial'", 1)
          open(p, 'w').write(s)
          EOF
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-elevator-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
