name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.smart --project-name smart_elevator /tmp/app
          cp main.dart /tmp/app/lib/main.dart
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cd /tmp/app
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH"/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          D=$(ls -d $HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-*/ | head -1)
          echo "Plugin dir: $D"
          ls "$D/android"
          find "$D/android" -name "*.kt" | head
          sed -i 's/package="[^"]*"//' "$D/android/src/main/AndroidManifest.xml"
          cat > "$D/android/build.gradle" <<'EOF'
          group 'io.github.edufolly.flutterbluetoothserial'
          version '1.0-SNAPSHOT'

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace 'io.github.edufolly.flutterbluetoothserial'
              compileSdkVersion 34
              defaultConfig {
                  minSdkVersion 19
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-elevator-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
